name: Проверка готовности запуска

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  launch-gate:
    name: Готовность запуска Frontsmith
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка состава и содержания
        run: npm run check

      - name: Сборка демонстрации
        run: npm run build:demo

      - name: Запуск тестов
        run: npm test
