name: Сообщение об ошибке
description: Сообщить о проблеме настройки, процесса, предпросмотра или готовности запуска
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение о проблеме Frontsmith. Не включайте рабочие секреты, данные клиентов, API-ключи и приватные записи бизнеса.
  - type: textarea
    id: problem
    attributes:
      label: Что произошло?
      description: Ясно опишите проблему.
      placeholder: Я выполнил npm run owner:brief и...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какой результат ожидался?
      description: Опишите ожидаемый результат.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите точную команду или процесс.
      placeholder: |
        1. npm install
        2. npm run check
        3. npm run ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Вывод по проблеме
      description: Вставьте вывод терминала без приватных данных.
      render: shell
  - type: input
    id: node
    attributes:
      label: Версия Node.js
      placeholder: "node -v"
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я удалил секреты, данные клиентов и приватные записи бизнеса из обращения
          required: true

