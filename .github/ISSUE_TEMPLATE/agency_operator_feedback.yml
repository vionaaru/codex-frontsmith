name: Отзыв агентства или оператора
description: Расскажите, подходит ли Frontsmith для реального местного бизнеса услуг
title: "[Отзыв агентства/оператора]: "
labels: ["feedback", "agency", "operator"]
body:
  - type: markdown
    attributes:
      value: |
        Здесь можно оставить практический отзыв о внедрении. Не включайте секреты, приватные данные клиентов, API-ключи, сведения об аккаунтах и реальные записи бизнеса.
  - type: dropdown
    id: role
    attributes:
      label: Ваша роль
      options:
        - Агентство
        - Разработчик
        - Оператор местного бизнеса услуг
        - Другое
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Реальный сценарий
      description: Опишите бизнес или клиентский процесс, который проверяете.
      placeholder: Подрядчику по ремонту нужны обновление сайта, ответы клиентам, сметы и проверки запуска.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Где подходит Frontsmith
      description: Какая часть работы цифрового офиса выглядит полезной?
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Препятствие внедрению
      description: Что мешает использовать или рекомендовать Frontsmith?
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Одно изменение для большей пользы
      description: По возможности оставайтесь в рамках v1.0.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Проверка безопасности
      options:
        - label: Я удалил секреты, данные клиентов и приватные записи бизнеса из обращения
          required: true
