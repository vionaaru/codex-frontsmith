name: Недостающая возможность
description: Предложите конкретное улучшение цифрового фронт-офиса Frontsmith
title: "[Возможность]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Frontsmith v1.0 ограничен настройкой, сводкой владельца, работой с клиентами, сметами, обновлением сайта, готовностью запуска, планированием расширений и согласованием внешних действий.
  - type: textarea
    id: gap
    attributes:
      label: Чего не хватает?
      description: Опишите пробел текущего процесса цифрового офиса.
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: Кому это нужно?
      description: Укажите роль оператора или сценарий бизнеса.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Ожидаемый процесс
      description: Опишите запрос, команду, результат, файл или состояние согласования.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Настройка бизнеса
        - Сводка владельца
        - Работа с клиентами
        - Сметы и предложения
        - Сайт
        - Готовность запуска
        - Планирование расширений
        - Документация
        - Другое
    validations:
      required: true

