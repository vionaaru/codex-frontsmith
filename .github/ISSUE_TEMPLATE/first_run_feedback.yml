name: Отзыв о первом запуске
description: Расскажите о результатах клонирования и первого знакомства с Frontsmith
title: "[Первый запуск]: "
labels: ["feedback", "activation"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за знакомство с Frontsmith. Не включайте секреты, приватные данные клиентов, API-ключи, сведения об аккаунтах сервисов и реальные записи бизнеса.
  - type: textarea
    id: goal
    attributes:
      label: Что вы хотели сделать?
      description: "Укажите вашу роль: разработчик, агентство или оператор."
      placeholder: Я хотел проверить, может ли Frontsmith...
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Выполненные команды
      description: Вставьте использованные команды.
      render: shell
      placeholder: |
        npm install
        npm run check
        npm run bootstrap -- --business-name "Acme" --website-url "https://business.example"
        npm run first-run:status
        npm run owner:brief
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что произошло?
      description: Укажите результат, ошибку, непонятный шаг или полезный вывод.
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: Что оказалось полезным?
      description: Укажите полезную часть настройки, сводки владельца, работы с клиентами, смет, обновления сайта или согласования.
  - type: textarea
    id: improvement
    attributes:
      label: Одно улучшение для упрощения внедрения
      description: Предлагайте конкретное практическое изменение.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: "Windows 11, Node 24, настольный Codex"
  - type: checkboxes
    id: safety
    attributes:
      label: Проверка безопасности
      options:
        - label: Я удалил секреты, данные клиентов и приватные записи бизнеса из обращения
          required: true
